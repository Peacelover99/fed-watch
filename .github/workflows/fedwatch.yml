name: Fed Watch

on:
  schedule:
    # 美国数据多在美东 8:30 / 10:00 公布（UTC 12:30~15:00，随夏令时浮动）
    # 工作日这段时间每 15 分钟检查一次；GitHub 定时任务常有 5~15 分钟延迟
    - cron: "*/15 12-15 * * 1-5"
    # 每天北京时间早上补一次（补前一日收盘的市场反应）
    - cron: "17 23 * * 0-4"
  workflow_dispatch:   # 也可以在 Actions 页面手动点 Run
    inputs:
      test_notify:
        description: "只发送一条测试推送（检查微信等渠道是否配置成功）"
        type: boolean
        default: false
  push:
    branches: [main]           # 只在 main 分支触发；发布 Release 打标签时不运行
    paths:
      - "data/consensus.csv"   # 录入新预期后自动重算

permissions:
  contents: write

concurrency:
  group: fedwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 推送测试
        if: ${{ inputs.test_notify }}
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m fedwatch test-notify

      - name: 运行监控
        if: ${{ !inputs.test_notify }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m fedwatch run

      - name: 保存数据和面板
        # 只在 main 分支保存（在标签或其他分支上手动运行时跳过，避免推送失败）
        if: ${{ !inputs.test_notify && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "fedwatch-bot"
          git config user.email "fedwatch-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
